<div class="card border-0 shadow-sm">

    <div class="card-header bg-success text-white">

        <h5 class="mb-0">Registrar arma</h5>

    </div>

    <div class="card-body">

        <form>

            
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Nombre del arma">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" rows="3" placeholder="Descripción del arma"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Calibre</label>
                <input type="text" class="form-control" placeholder="Introduce el calibre">
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>

                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" placeholder="Precio del arma">
                </div>

            </div>

            <button type="button" class="btn btn-success w-100">
                Registrar arma
            </button>

        </form>

    </div>

</div>
