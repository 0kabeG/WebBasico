<div class="row g-3">

    @for (t of personals(); track $index) {

    <div class="col-md-6">

        <div class="card h-100 border-0 shadow-sm">

            <div class="card-header bg-success text-white">

                <h5 class="mb-0">{{ t.name }}</h5>

            </div>

            <div class="card-body d-flex flex-column">

                <p class="card-text">
                    <small class="text-muted">
                        Grado: {{ t.rank }}
                    </small>
                </p>

                <p class="card-text">
                    <small class="text-muted">
                        Especialidad: {{ t.speciality }}
                    </small>
                </p>

                <p class="card-text">
                    <small class="text-muted">
                        Situación: {{ t.situation }}
                    </small>
                </p>

                <hr>

                <button class="btn btn-outline-danger mt-auto align-self-start" (click)="service.delete(t.name)" >
                    Eliminar
                </button>

            </div>

        </div>

    </div>

    }

</div>
