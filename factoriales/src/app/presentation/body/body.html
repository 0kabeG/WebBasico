<div class="card mt-3">
    <div class="text-center mb-3">
        <h1>Introduce el numero y presiona calcular</h1>
    </div>
    <div>
        <div class="d-flex gap-3 text-center justify-content-center">
            <input type="number" #numero >
            <button (click)="calcular(numero.valueAsNumber)" class="btn btn-success">Calcular</button>
        </div>
        <div class="d-flex justify-content-center text-center mt-3" >

           <span class="h5 border border-success border-2">{{resultado}}</span>
            
        </div>
    </div>
</div>
